<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TideMovies</title>
  <style>
    :root{
        --bg:#3b0a12;                 
        --card:#5a0f1b;            
        --text:#fff5f6;             
        --muted:#f1c6cc;             
        --accent:#9e1b32;           
        --danger:#ff8f8f;
        --ok:#7dd3a6;
        --border: rgba(255,255,255,.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 10% 0%, rgba(122,162,255,.25), transparent 55%),
                  radial-gradient(900px 500px at 90% 10%, rgba(74,222,128,.18), transparent 60%),
                  var(--bg);
      color:var(--text);
      padding: 28px 16px;
    }
    .wrap{max-width: 950px; margin: 0 auto;}
    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
      margin-bottom: 18px;
    }
    h1{margin:0; font-size: 34px; letter-spacing:.2px}
    .subtitle{color:var(--muted); margin-top:6px; font-size: 14px}
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .grid{
      display:grid;
      grid-template-columns: 1.4fr .6fr .9fr auto;
      gap: 12px;
      align-items:end;
    }
    label{display:block; font-size: 12px; color: var(--muted); margin-bottom: 6px}
    input{
      width:100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.25);
      color: var(--text);
      outline:none;
    }
    input:focus{border-color: rgba(122,162,255,.7)}
    .btn{
      border: 1px solid var(--border);
      background: rgba(122,162,255,.18);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight: 600;
      transition: transform .05s ease, background .15s ease;
      white-space:nowrap;
    }
    .btn:hover{background: rgba(122,162,255,.28)}
    .btn:active{transform: translateY(1px)}
    .btn-danger{background: rgba(255,107,107,.16)}
    .btn-danger:hover{background: rgba(255,107,107,.26)}
    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }
    table{
      width:100%;
      border-collapse: collapse;
      margin-top: 14px;
      overflow:hidden;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    th, td{
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      text-align:left;
      font-size: 14px;
    }
    th{
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .6px;
      text-transform: uppercase;
      background: rgba(0,0,0,.18);
    }
    tr:last-child td{border-bottom:none}
    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.18);
      font-size: 12px;
      color: var(--muted);
    }
    .fav{color:#ffd166}
    .pill{
      display:inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.18);
    }
    .pill-ok{color: var(--ok)}
    .pill-no{color: var(--muted)}
    .actions{
      display:flex;
      gap: 8px;
      flex-wrap:wrap;
    }
    .small{padding: 8px 10px; font-size: 12px}
    .hint{color: var(--muted); font-size: 12px; margin-top: 8px}
    @media (max-width: 760px){
      .grid{grid-template-columns: 1fr 1fr; }
      .grid .span2{grid-column: span 2;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Tide Movies</h1>
        <div class="subtitle">Welcome to Tide Movies! Track what you’ve watched and rate it. Sorted by rating (highest first).</div>
      </div>
      <div class="badge" id="statsBadge">0 movies</div>
    </header>

    <section class="card">
      <form id="movieForm">
        <div class="grid">
          <div class="span2">
            <label for="movieName">Movie Name</label>
            <input id="movieName" placeholder="Ex. Cars" required maxlength="80" />
          </div>

          <div>
            <label for="rating">Rating (0–10)</label>
            <input id="rating" type="number" min="0" max="10" step="0.1" placeholder="9" required />
          </div>

          <div>
            <label for="dateReleased">Date Released</label>
            <input id="dateReleased" type="date" required />
          </div>

          <div>
            <button class="btn" type="submit">Add Movie</button>
          </div>
        </div>

        <div class="row">
          <button class="btn btn-danger small" type="button" id="clearAllBtn">Clear All</button>
        </div>
      </form>

      <table aria-label="Movies table">
        <thead>
          <tr>
            <th style="width:40%">Movie Name</th>
            <th style="width:12%">Rating</th>
            <th style="width:20%">Date Released</th>
            <th style="width:12%">Favorited</th>
            <th style="width:16%">Actions</th>
          </tr>
        </thead>
        <tbody id="moviesTbody"></tbody>
      </table>
    </section>
  </div>

  <script defer src="./app.js"></script>
  <script defer src="./index.js"></script>
</body>
</html>
